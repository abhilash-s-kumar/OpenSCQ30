name: build-debug-apk

on:
  workflow_dispatch:
  push:
    branches: [battery-percent-widget]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install build tools
        uses: ./.github/actions/install-android-build-tools
        with:
          cache: true
          arch: arm64-v8a

      - name: Build debug apk (arm64-v8a)
        working-directory: android
        run: ./gradlew assembleArm64-v8aDebug

      - name: Upload apk
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: openscq30-debug-arm64-v8a
          path: android/app/build/outputs/apk/**/*.apk

      - name: Publish apk to the latest-debug release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          apk="$(find android/app/build/outputs/apk -name '*.apk' | head -n 1)"
          cp "$apk" openscq30-debug-arm64-v8a.apk
          gh release delete latest-debug --yes --cleanup-tag -R "$GITHUB_REPOSITORY" || true
          gh release create latest-debug openscq30-debug-arm64-v8a.apk \
            -R "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease \
            --title "Debug build ($GITHUB_RUN_NUMBER)" \
            --notes "Debug build of ${GITHUB_SHA::7} from the battery-percent-widget branch. Installs alongside the regular app."

      - name: Fast Pair parser unit tests
        working-directory: android
        run: ./gradlew testArm64-v8aDebugUnitTest --tests 'com.oppzippy.openscq30.features.fastpair.*'
