name: build-debug-apk

on:
  workflow_dispatch:
  push:
    branches: [battery-percent-widget]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install build tools
        uses: ./.github/actions/install-android-build-tools
        with:
          cache: true
          arch: arm64-v8a

      - name: Build debug apk (arm64-v8a)
        working-directory: android
        run: ./gradlew assembleArm64-v8aDebug

      - name: Upload apk
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: openscq30-debug-arm64-v8a
          path: android/app/build/outputs/apk/**/*.apk

      - name: Fast Pair parser unit tests
        working-directory: android
        run: ./gradlew testArm64-v8aDebugUnitTest --tests 'com.oppzippy.openscq30.features.fastpair.*'
